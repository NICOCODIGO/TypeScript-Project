<!-- 
for this project this is going to be my first time working on Typescript, 
the src folder will pretend that is an external source like an API. Theres data created in there
that the json will be parsed from.
I learned in this project that Node.js is required to run Typescript, and the npm is downloaded (Node package manager).
after the npm init command is run with default settings, it will download a package.json file,
after that, a tsconfig.json must be created to tell the the ts files where to find the data src, where to put it, and what kind of output to make.

TL;DR

TypeScript is like writing a fancy recipe with clear instructions, but the browser only understands simple cooking steps and finished dishes (JavaScript).
Node.js is like a special kitchen that helps you turn your fancy recipe (TypeScript) into simple cooking steps (JavaScript) that the browser can understand.
The tools Node.js used is stored in node_modules folder, package.json is a shopping list that tells Node.js what ingredients (tools) to use,
as for tsconfig.json is like the oven settings, telling Node.js how to bake your recipe (TypeScript) into a dish (JavaScript).
 -->
